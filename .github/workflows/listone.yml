# Due lavori in uno, entrambi settimanali:
#
#  1. data/tt/*.json  - i risultati di ogni Titled Tuesday, ridotti a
#     username -> [punti, piazzamento]. Sono questi a far comparire i
#     punteggi da soli: l'app li legge e calcola, nessuno preme niente.
#     Mezzo mega di classifica diventa 6 KB.
#
#  2. data/listone.json - medie, presenze e prezzi ricalcolati.
#
# Serve perche' medie e presenze invecchiano: un giocatore che sei mesi fa
# c'era sempre puo' aver smesso, e il prezzo deve seguirlo. Gira di mercoledi'
# mattina, quando i risultati del martedi' sono ormai consolidati.
#
# Nota: GitHub sospende i workflow programmati sui repository fermi da 60
# giorni. Se la lega resta inattiva a lungo, riattivalo dalla scheda Actions
# oppure lancialo a mano con "Run workflow".

name: Aggiorna listone e risultati

on:
  schedule:
    - cron: "0 6 * * 3"      # ogni mercoledi' alle 06:00 UTC
  workflow_dispatch:          # e quando vuoi tu, dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: listone
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pubblica i risultati dei tornei
        run: python tools/build_results.py --events 12

      - name: Rigenera il listone
        run: python tools/build_listone.py --events 26 --top 90

      - name: Committa solo se e' cambiato qualcosa
        run: |
          git add -A data/tt data/listone.json
          if git diff --cached --quiet; then
            echo "Nessun torneo nuovo e prezzi invariati: niente da committare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Risultati e listone aggiornati automaticamente"
          git push
