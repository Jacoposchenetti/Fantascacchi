<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantascacchi</title>
<meta name="description" content="Fanta-lega sugli scacchisti veri: asta, formazioni e classifica sui Titled Tuesday di chess.com.">
<meta name="theme-color" content="#12100e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">

<!-- App installabile sulla schermata home -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./data/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantascacchi">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="topbar" id="topbar" hidden>
  <a class="brand" href="#/">♞ <span>Fantascacchi</span></a>
  <nav class="tabs" id="tabs"></nav>
  <div class="topbar-right">
    <button class="btn btn-ghost btn-sm" id="btn-invite" hidden>Invita</button>
    <span class="me" id="me"></span>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<div class="toasts" id="toasts"></div>

<dialog class="modal" id="modal">
  <div class="modal-body" id="modal-body"></div>
</dialog>

<script type="module" src="./js/app.js"></script>
<script>
  // Registrato dopo il caricamento: non deve rallentare il primo avvio.
  // Se non c'e' (http, browser vecchio) l'app funziona lo stesso, solo
  // senza installazione e senza offline.
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((e) => {
        console.info("Service worker non registrato:", e.message);
      });
    });
    // Quando il worker nuovo prende il controllo, ricarica una volta sola:
    // cosi' chi aveva l'app aperta passa al codice nuovo senza accorgersene.
    let ricaricato = false;
    navigator.serviceWorker.addEventListener("message", (ev) => {
      if (ev.data && ev.data.tipo === "sw-aggiornato" && !ricaricato) {
        ricaricato = true;
        location.reload();
      }
    });
  }
</script>
<noscript><p style="padding:2rem;font:16px system-ui">Fantascacchi ha bisogno di JavaScript attivo.</p></noscript>
</body>
</html>
